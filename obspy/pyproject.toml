[tool.poetry]
name = "earthsounds-obspy"
version = "0.5.0"
description = "Producer for generting and parsing raw earthquake data"
authors = ["Selwyn-Lloyd McPherson <selwyn.mcpherson@gmail.com>"]
readme = "README.md"
# While in development, this pyproject.toml is specific for the script (non-package)
include = ["producer.py"]

[tool.black]
line-length = 116

[tool.poetry.dependencies]
python = "^3.11"
obspy = "^1.4.1"
kafka-python = "^2.0.2"
boto3 = "^1.34.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
